<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Colectivos (prueba)</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --txt: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --sec: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btntxt: var(--tg-theme-button-text-color, #ffffff);
    --verde: #2e9e6a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--txt);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: 10px 8px 24px; max-width: 520px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 2px 4px 2px; }
  .sub { color: var(--hint); font-size: 13px; margin: 0 4px 10px; }
  .fila { display: flex; gap: 6px; margin: 0 4px 10px; flex-wrap: wrap; }
  .tab, .dia { flex: 1; border: 0; border-radius: 10px; padding: 8px 6px; font-size: 13px;
    background: var(--sec); color: var(--txt); cursor: pointer; text-align: center; }
  .dia { flex: 0 0 auto; padding: 6px 12px; border-radius: 16px; }
  .tab.on, .dia.on { background: var(--btn); color: var(--btntxt); }
  .tab small { display: block; font-size: 11px; opacity: .8; }
  .op { background: var(--sec); border-radius: 12px; padding: 10px 12px; margin: 0 4px 8px; }
  .cab { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; gap: 8px; }
  .cab b { font-size: 15px; }
  .precio { color: var(--verde); font-weight: 600; white-space: nowrap; }
  .paso { display: flex; gap: 8px; padding: 3px 0; align-items: flex-start; }
  .ic { width: 20px; text-align: center; flex: 0 0 20px; }
  .ln { display: inline-block; background: var(--btn); color: var(--btntxt); border-radius: 6px; padding: 0 6px;
    font-weight: 700; font-size: 13px; margin-right: 2px; }
  .ln.alt { background: transparent; color: var(--btn); box-shadow: inset 0 0 0 1.5px var(--btn); }
  .h { color: var(--hint); font-size: 12.5px; }
  .sube { color: var(--verde); font-size: 12.5px; }
  .tl { display: block; position: relative; padding: 2px 0 2px 20px; margin: 4px 0 2px; }
  .tl::before { content: ""; position: absolute; left: 5px; top: 10px; bottom: 10px; width: 2px; background: var(--btn); }
  .tl .pt { position: relative; display: block; }
  .tl .pt::before { content: ""; position: absolute; left: -20px; top: 4px; width: 12px; height: 12px; border-radius: 50%; }
  .tl .s::before { background: #2e9e6a; } .tl .b::before { background: #d9534f; }
  .tl a { color: var(--txt); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .tl .medio { display: block; color: var(--hint); font-size: 12.5px; padding: 1px 0; }
  .semana { background: var(--sec); border-radius: 12px; padding: 10px; margin: 4px 4px 8px; text-align: center; }
  .semana b { font-size: 16px; }
  .aviso { color: var(--hint); font-size: 13px; text-align: center; padding: 18px 10px; }
  .pie { color: var(--hint); font-size: 11.5px; text-align: center; margin: 10px 4px 0; }
  .cargando { text-align: center; color: var(--hint); padding: 40px 0; }
</style>
</head>
<body>
  <div id="app"><div class="cargando">🚌 Cargando recorridos…</div></div>

<script>
// ───────── Configuración ─────────
// URL /exec del Apps Script de TEST (la misma que la propiedad WEBAPP_URL). Se usa solo para pedir tu casa.
const API = "https://script.google.com/macros/s/AKfycbxEM5UrAC_qGgYkrEZAusbO0zbZobuYLAQxqOTtpGD_1Nqkg57OJdZER_faflv1Fhtz/exec";
const DATOS = "colectivos.json";
const CERCA_M = 500, TRANSBORDO_M = 300, MIN_TRAMO_KM = 1.0, A_PIE_M = 1200, CELDA = 0.0025;
const DIAS = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];

const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ── Modo "postular" (prueba 22/11): el navegador interno de Telegram no termina bien la postulación
// del ABC ("no estás inscripto"); en Chrome sí. Con startapp=p esta ventana abre el ABC afuera y se cierra.
const URL_POSTULACION = "https://misaplicaciones5.abc.gob.ar/postulacionAPD/";
const MODO = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || new URLSearchParams(location.search).get("tgWebAppStartParam") || "";
if (MODO === "p") {
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("app").innerHTML = '<div class="cargando">📝 Abriendo la postulación en tu navegador…<br><br>'
      + '<a href="' + URL_POSTULACION + '" id="manual">Si no se abre, tocá acá</a></div>';
    const abrir = () => { if (tg && tg.openLink) tg.openLink(URL_POSTULACION); else location.href = URL_POSTULACION; };
    document.getElementById("manual").onclick = e => { e.preventDefault(); abrir(); };
    abrir();
    setTimeout(() => { if (tg && tg.close) tg.close(); }, 1500);
  });
}

// ───────── Utilidades ─────────
function metros(a, b) {
  const la = (a[0] + b[0]) / 2 * Math.PI / 180;
  return Math.hypot((b[1] - a[1]) * 111320 * Math.cos(la), (b[0] - a[0]) * 110540);
}
function esc(s) { return String(s || "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }
function hhmm(m) { return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
function plata(p) { return "$" + Math.round(p).toLocaleString("es-AR"); }
function fmtKm(km) { return km < 1 ? Math.round(km * 10) * 100 + " m" : km.toFixed(1).replace(".", ",") + " km"; }
function aPie(m) { return Math.max(1, Math.round(m * 1.3 / 80)); }   // minutos caminando (1,3 por las esquinas)

function leerParametro() {
  let p = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  const q = new URLSearchParams(location.search);
  if (!p) p = q.get("tgWebAppStartParam") || q.get("d");
  if (!p) return null;
  try {
    const b = p.replace(/-/g, "+").replace(/_/g, "/");
    const txt = decodeURIComponent(escape(atob(b + "===".slice((b.length + 3) % 4))));
    return JSON.parse(txt);
  } catch (e) { return null; }
}

// ───────── Datos de recorridos ─────────
let LINEAS = [], GRILLA = new Map(), TARIFAS = [], FECHA = "";

function cargarDatos(d) {
  TARIFAS = d.t; FECHA = d.f;
  LINEAS = d.l.map(L => {
    const crudos = []; let a = 0, b = 0;
    for (let i = 0; i < L.p.length; i += 2) { a += L.p[i]; b += L.p[i + 1]; crudos.push([a / 1e5, b / 1e5]); }
    // el archivo trae el trazado simplificado: lo relleno con un punto cada ~50 m para medir bien las distancias
    const pts = [crudos[0]], nuevo = [0], km = [0];
    for (let i = 1; i < crudos.length; i++) {
      const p0 = crudos[i - 1], p1 = crudos[i], dm = metros(p0, p1), n = Math.max(1, Math.ceil(dm / 50));
      for (let k = 1; k <= n; k++) {
        pts.push([p0[0] + (p1[0] - p0[0]) * k / n, p0[1] + (p1[1] - p0[1]) * k / n]);
        km.push(km[km.length - 1] + dm / n / 1000);
      }
      nuevo.push(pts.length - 1);
    }
    const paradas = []; let i0 = 0;
    for (let k = 0; k < L.s.length; k += 2) { i0 += L.s[k]; paradas.push({ i: nuevo[i0], n: d.n[L.s[k + 1]] || "" }); }
    return { ref: L.r, ramal: L.m, hasta: L.h, pts, km, paradas };
  });
  LINEAS.forEach((L, li) => L.pts.forEach((p, i) => {
    const k = Math.floor(p[0] / CELDA) + "," + Math.floor(p[1] / CELDA);
    let v = GRILLA.get(k); if (!v) GRILLA.set(k, v = []); v.push(li, i);
  }));
}

function celdasCerca(P) {     // la celda del punto y sus 8 vecinas
  const cx = Math.floor(P[0] / CELDA), cy = Math.floor(P[1] / CELDA), res = [];
  for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) { const v = GRILLA.get((cx + dx) + "," + (cy + dy)); if (v) res.push(v); }
  return res;
}

function cercanas(P, radio = CERCA_M) {
  const cx = Math.floor(P[0] / CELDA), cy = Math.floor(P[1] / CELDA), r = Math.floor(radio / 230) + 1;
  const res = new Map();
  for (let dx = -r; dx <= r; dx++) for (let dy = -r; dy <= r; dy++) {
    const v = GRILLA.get((cx + dx) + "," + (cy + dy)); if (!v) continue;
    for (let k = 0; k < v.length; k += 2) {
      const li = v[k], i = v[k + 1], d = metros(P, LINEAS[li].pts[i]);
      if (d <= radio && (!res.has(li) || d < res.get(li)[1])) res.set(li, [i, d]);
    }
  }
  return res;
}

function precio(km) {
  for (const [hasta, p] of TARIFAS) if (km <= hasta) return p;
  return TARIFAS[TARIFAS.length - 1][1];
}

function minutos(o) { return Math.round(o.km / 15 * 60 + aPie(o.pie) + (o.tramos.length > 1 ? 8 : 0)); }
function costo(o) { return o.tramos.reduce((s, t, n) => s + precio(t.km) * (n ? 0.5 : 1), 0); }

function opciones(A, B) {
  const na = cercanas(A), nb = cercanas(B);
  let ops = [];
  for (const [li, [ia, da]] of na) {
    if (!nb.has(li)) continue;
    const [ib, db] = nb.get(li), L = LINEAS[li], km = L.km[ib] - L.km[ia];
    if (ib > ia && km >= MIN_TRAMO_KM) ops.push({ tramos: [{ li, ia, ib, km }], pie: da + db, pies: [da, db], km });
  }
  if (new Set(ops.map(o => LINEAS[o.tramos[0].li].ref)).size < 3) {
    for (const [l1, [ia, da]] of na) {
      const L1 = LINEAS[l1], mejor = new Map();
      for (let i = ia + 1; i < L1.pts.length; i++) {
        const k1 = L1.km[i] - L1.km[ia];
        if (k1 < MIN_TRAMO_KM) continue;
        const P = L1.pts[i];
        for (const v of celdasCerca(P)) for (let k = 0; k < v.length; k += 2) {
          const l2 = v[k], j = v[k + 1];
          if (!nb.has(l2) || l2 === l1 || LINEAS[l2].ref === L1.ref) continue;
          const ib = nb.get(l2)[0]; if (j >= ib) continue;
          const L2 = LINEAS[l2], k2 = L2.km[ib] - L2.km[j];
          if (k2 < MIN_TRAMO_KM) continue;
          const dt = metros(P, L2.pts[j]);
          if (dt <= TRANSBORDO_M && (!mejor.has(l2) || k1 + k2 + dt / 500 < mejor.get(l2).total + mejor.get(l2).dt / 500)) mejor.set(l2, { total: k1 + k2, i, j, k1, k2, dt });
        }
      }
      for (const [l2, m] of mejor) {
        const db = nb.get(l2)[1];
        ops.push({ tramos: [{ li: l1, ia, ib: m.i, km: m.k1 }, { li: l2, ia: m.j, ib: nb.get(l2)[0], km: m.k2 }],
                   pie: da + db + m.dt, pies: [da, db], combina: m.dt, km: m.total });
      }
    }
  }
  const puntaje = o => o.km + o.pie / 1000;
  const directos = ops.filter(o => o.tramos.length === 1).map(puntaje);
  if (directos.length) { const tope = Math.min(...directos) * 0.8; ops = ops.filter(o => o.tramos.length === 1 || puntaje(o) + 2 < tope); }
  ops.sort((a, b) => a.tramos.length - b.tramos.length || puntaje(a) - puntaje(b));
  // una opción por combinación de números de línea
  const vistos = new Set(), unicas = [];
  for (const o of ops) {
    const clave = o.tramos.map(t => LINEAS[t.li].ref).join(">");
    if (!vistos.has(clave)) { vistos.add(clave); unicas.push(o); }
  }
  // las que hacen el mismo viaje con otra línea al principio se juntan
  const final = [];
  for (const o of unicas) {
    o.alt = [];
    const f = final.find(f => f.tramos.length === o.tramos.length && Math.abs(f.km - o.km) <= Math.max(0.8, 0.12 * f.km)
      && metros(LINEAS[f.tramos[0].li].pts[f.tramos[0].ia], LINEAS[o.tramos[0].li].pts[o.tramos[0].ia]) < 300
      && metros(LINEAS[f.tramos[0].li].pts[f.tramos[0].ib], LINEAS[o.tramos[0].li].pts[o.tramos[0].ib]) < 300
      && (o.tramos.length === 1 || LINEAS[f.tramos[1].li].ref === LINEAS[o.tramos[1].li].ref));
    if (f) { if (!f.alt.includes(LINEAS[o.tramos[0].li].ref)) f.alt.push(LINEAS[o.tramos[0].li].ref); }
    else final.push(o);
  }
  final.sort((a, b) => minutos(a) - minutos(b));
  const mejor = final.length ? minutos(final[0]) : 0;
  return final.filter(o => minutos(o) <= mejor * 1.6 + 15).slice(0, 3);
}

function paradaCerca(L, i) {
  let m = null;
  for (const s of L.paradas) if (!m || Math.abs(s.i - i) < Math.abs(m.i - i)) m = s;
  return m;
}
function paradasEntre(L, ia, ib) { return L.paradas.filter(s => s.i > ia && s.i <= ib).length; }

// ───────── Pantalla ─────────
const P = leerParametro();
let CASA = null, CASA_ESTADO = "cargando", DIA = 0, ORIGEN = null;

function origenesDelDia(d) {
  const o = d[3], lista = [];
  if (o) lista.push({ tipo: "esc", nombre: o[0], pos: [o[1] / 1e5, o[2] / 1e5], principal: o[3] === 1 });
  lista.push({ tipo: "casa", nombre: "casa", pos: CASA, principal: !o || o[3] !== 1 });
  return lista;
}

function linkParada(L, s, extra) {
  const p = L.pts[s.i];
  const url = "https://www.google.com/maps/search/?api=1&query=" + p[0].toFixed(6) + "," + p[1].toFixed(6);
  return `<a data-url="${url}">${esc(s.n || extra)}</a>`;
}

function htmlOpcion(o) {
  const dosColes = o.tramos.length > 1;
  let h = `<div class="op"><div class="cab"><b>≈ ${minutos(o)} min · ${dosColes ? "2 colectivos" : "directo"}</b>`
        + `<span class="precio">≈ ${plata(costo(o))}</span></div>`;
  o.tramos.forEach((t, n) => {
    const L = LINEAS[t.li], sube = paradaCerca(L, t.ia), baja = paradaCerca(L, t.ib), np = paradasEntre(L, t.ia, t.ib);
    if (n === 0) h += `<div class="paso"><span class="ic">🚶</span><span>${Math.round(o.pies[0])} m hasta la parada</span></div>`;
    else if (o.combina > 60) h += `<div class="paso"><span class="ic">🚶</span><span class="h">${Math.round(o.combina)} m para combinar</span></div>`;
    let lineas = `<span class="ln">${esc(L.ref)}</span>`;
    if (n === 0) o.alt.forEach(a => lineas += `<span class="ln alt">${esc(a)}</span>`);
    const det = [n === 0 && o.alt.length ? "" : L.ramal, L.hasta ? "hacia " + L.hasta : ""].filter(Boolean).map(esc).join(" · ");
    const medio = [np ? np + " paradas" : "", fmtKm(t.km)].filter(Boolean).join(" · ");
    h += `<div class="paso"><span class="ic">🚌</span><span style="flex:1">${lineas} <span class="h">${det}</span>`
       + (n === 1 ? ` <span class="sube">−50% Red SUBE</span>` : "")
       + `<span class="tl">`
       + (sube ? `<span class="pt s">${linkParada(L, sube, "Parada de subida")}</span>` : "")
       + `<span class="medio">${medio}</span>`
       + (baja ? `<span class="pt b">${linkParada(L, baja, "Parada de bajada")}</span>` : "")
       + `</span></span></div>`;
  });
  h += `<div class="paso"><span class="ic">🚶</span><span>${Math.round(o.pies[1])} m hasta la escuela</span></div></div>`;
  return h;
}

function viajeDe(A, B) {
  const d = metros(A, B);
  if (d < A_PIE_M) return { pie: d, ops: [] };
  return { pie: null, ops: opciones(A, B) };
}

function semana() {
  let total = 0, dias = 0, faltan = 0;
  for (const d of P.d) {
    const o = origenesDelDia(d).find(x => x.principal);
    if (!o.pos) { faltan++; continue; }
    const v = viajeDe(o.pos, DEST);
    if (v.pie !== null) { if (v.pie < 40) faltan++; else dias++; continue; }
    if (!v.ops.length) { faltan++; continue; }
    total += 2 * costo(v.ops[0]); dias++;
  }
  if (!dias) return "";
  return `<div class="semana">💲 <b>Semana ≈ ${total ? plata(total) : "$0"}</b><br><span class="h">${dias} día${dias > 1 ? "s" : ""}`
       + ` · ida y vuelta · con la opción más rápida${faltan ? ` · sin dato para ${faltan} día${faltan > 1 ? "s" : ""}` : ""}</span></div>`;
}

let DEST = null;
function pintar() {
  const app = document.getElementById("app");
  if (!P || !P.a || !P.d) { app.innerHTML = `<div class="aviso">Abrí esta ventana desde el link 🚌 Colectivos de una oferta.</div>`; return; }
  DEST = [P.a[0] / 1e5, P.a[1] / 1e5];
  const d = P.d[DIA], origenes = origenesDelDia(d);
  if (!ORIGEN || !origenes.some(o => o.tipo === ORIGEN)) ORIGEN = origenes.find(o => o.principal).tipo;
  const o = origenes.find(x => x.tipo === ORIGEN);
  let h = `<h1>🚌 Colectivos a ${esc(P.n)}</h1><p class="sub">${esc(P.l ? P.l + " · " : "")}${DIAS[d[0]]} ${hhmm(d[1])} a ${hhmm(d[2])}</p>`;
  if (P.d.length > 1) h += `<div class="fila">` + P.d.map((x, i) => `<button class="dia${i === DIA ? " on" : ""}" data-dia="${i}">${DIAS[x[0]].slice(0, 3)}</button>`).join("") + `</div>`;
  h += `<div class="fila">` + origenes.map(x => `<button class="tab${x.tipo === ORIGEN ? " on" : ""}" data-origen="${x.tipo}">`
     + (x.tipo === "casa" ? "🏠 Desde casa" : "🏫 Desde " + esc(x.nombre))
     + (x.principal ? `<small>${x.tipo === "casa" ? (d[3] ? "tenés 3 h o más libres" : "primera del día") : "venís de ahí"}</small>` : "")
     + `</button>`).join("") + `</div>`;
  if (o.tipo === "casa" && !o.pos) {
    h += `<div class="aviso">${CASA_ESTADO === "cargando" ? "Buscando tu casa…" : CASA_ESTADO === "sin" ? "Todavía no cargaste tu casa. Agregala en 🗓️ Mis horarios." : "No pude ubicar tu casa. Revisá que en 🗓️ Mis horarios tenga calle, número y localidad."}</div>`;
  } else {
    const v = viajeDe(o.pos, DEST);
    if (v.pie !== null && v.pie < 40) h += `<div class="aviso">Las dos direcciones quedaron en el mismo punto del mapa (la ubicación es aproximada), así que no puedo calcular este viaje.</div>`;
    else if (v.pie !== null) h += `<div class="op"><div class="cab"><b>🚶 A pie · ≈ ${aPie(v.pie)} min</b><span class="precio">$0</span></div><span class="h">Queda a ${Math.round(v.pie * 1.3)} m caminando, aprox.</span></div>`;
    else if (!v.ops.length) h += `<div class="aviso">No encontré colectivos que pasen a menos de ${CERCA_M} m de los dos lugares. Puede que falte la línea en el mapa.</div>`;
    else h += v.ops.map(htmlOpcion).join("");
  }
  h += semana();
  h += `<p class="pie">Tiempos y precios aproximados (tarifa SUBE registrada). Recorridos de OpenStreetMap, actualizados el ${esc(FECHA)}.</p>`;
  app.innerHTML = h;
  app.querySelectorAll("[data-dia]").forEach(b => b.onclick = () => { DIA = +b.dataset.dia; ORIGEN = null; pintar(); });
  app.querySelectorAll("[data-origen]").forEach(b => b.onclick = () => { ORIGEN = b.dataset.origen; pintar(); });
  app.querySelectorAll("a[data-url]").forEach(a => a.onclick = () => {      // parada → Google Maps
    if (tg && tg.openLink) tg.openLink(a.dataset.url); else window.open(a.dataset.url, "_blank");
  });
}

async function pedirCasa() {
  const q = new URLSearchParams(location.search).get("casa");     // solo para probar en el navegador
  if (q) { const [a, b] = q.split(",").map(Number); CASA = [a, b]; CASA_ESTADO = "ok"; return; }
  const init = tg && tg.initData;
  if (!init || API.startsWith("PEGAR")) { CASA_ESTADO = "error"; return; }
  try {
    const r = await fetch(API + "?accion=casa&init=" + encodeURIComponent(init));
    const j = await r.json();
    if (j.casa) { CASA = [j.casa.la, j.casa.lo]; CASA_ESTADO = "ok"; }
    else CASA_ESTADO = j.error === "sin casa" ? "sin" : "error";
  } catch (e) { CASA_ESTADO = "error"; }
}

(async () => {
  if (MODO === "p") return;          // modo postular: no carga recorridos
  const casa = pedirCasa().then(() => { if (LINEAS.length) pintar(); });
  try {
    const r = await fetch(DATOS, { cache: "default" });
    cargarDatos(await r.json());
  } catch (e) {
    document.getElementById("app").innerHTML = `<div class="aviso">No pude cargar los recorridos. Probá de nuevo en un rato.</div>`;
    return;
  }
  pintar();
  await casa;
})();
