<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mis horarios</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --txt: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --sec: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btntxt: var(--tg-theme-button-text-color, #ffffff);
    --ocupado: #e5484d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--txt);
    font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: 10px 8px 90px; }
  h1 { font-size: 17px; margin: 2px 4px 4px; }
  p.ayuda { margin: 0 4px 10px; color: var(--hint); font-size: 13px; }
  .grilla { display: grid; grid-template-columns: 40px repeat(6, 1fr); gap: 2px;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  .cab { text-align: center; font-weight: 600; font-size: 12px; padding: 4px 0;
    position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .hora { font-size: 10px; color: var(--hint); text-align: right; padding-right: 4px;
    height: 17px; line-height: 17px; }
  .hora.media { visibility: hidden; }
  .c { height: 17px; background: var(--sec); border-radius: 3px; }
  .c.lleno { background: var(--ocupado); }
  .c.hora-entera { box-shadow: inset 0 1px 0 rgba(128,128,128,.25); }
  .barra { display: flex; gap: 8px; margin: 12px 4px 0; align-items: center; }
  .barra button { border: 0; border-radius: 8px; padding: 9px 12px; font-size: 14px;
    background: var(--sec); color: var(--txt); }
  .barra .total { margin-left: auto; color: var(--hint); font-size: 13px; }
  #guardarWeb { display: none; width: 100%; margin-top: 12px; padding: 12px; border: 0;
    border-radius: 10px; background: var(--btn); color: var(--btntxt); font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
  <h1>🗓️ Mis horarios</h1>
  <p class="ayuda">Pintá en rojo las horas en que <b>ya trabajás</b>. Tocá o arrastrá el dedo.
    Las ofertas que se superpongan te van a llegar marcadas con 🔴.</p>
  <div class="grilla" id="grilla"></div>
  <div class="barra">
    <button id="borrar">🧹 Borrar todo</button>
    <span class="total" id="total"></span>
  </div>
  <button id="guardarWeb">Guardar</button>

<script>
  // 6 días (lun a sáb) × 32 bloques de 30 min (de 7:00 a 23:00).
  // Se codifica en 48 caracteres hex: 8 por día, el bloque 0 (7:00) es el bit más alto.
  const DIAS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
  const BLOQUES = 32, INICIO = 7 * 60;
  const tg = window.Telegram && Telegram.WebApp;
  const estado = DIAS.map(() => new Array(BLOQUES).fill(false));

  function decodificar(hex) {
    if (!/^[0-9a-f]{48}$/i.test(hex || '')) return;
    for (let d = 0; d < 6; d++) {
      const bits = parseInt(hex.substr(d * 8, 8), 16);
      for (let i = 0; i < BLOQUES; i++) estado[d][i] = !!((bits >>> (31 - i)) & 1);
    }
  }
  function codificar() {
    return estado.map(dia => {
      let n = 0;
      dia.forEach((v, i) => { if (v) n += Math.pow(2, 31 - i); });
      return n.toString(16).padStart(8, '0');
    }).join('');
  }
  function hhmm(min) { return `${Math.floor(min / 60)}:${String(min % 60).padStart(2, '0')}`; }

  // Armar la grilla
  const g = document.getElementById('grilla');
  g.appendChild(Object.assign(document.createElement('div'), { className: 'cab' }));
  DIAS.forEach(d => g.appendChild(Object.assign(document.createElement('div'), { className: 'cab', textContent: d })));
  const celdas = DIAS.map(() => []);
  for (let i = 0; i < BLOQUES; i++) {
    const min = INICIO + i * 30;
    g.appendChild(Object.assign(document.createElement('div'),
      { className: 'hora' + (min % 60 ? ' media' : ''), textContent: hhmm(min) }));
    for (let d = 0; d < 6; d++) {
      const c = document.createElement('div');
      c.className = 'c' + (min % 60 ? '' : ' hora-entera');
      c.dataset.d = d; c.dataset.i = i;
      g.appendChild(c);
      celdas[d][i] = c;
    }
  }

  function pintar() {
    let n = 0;
    for (let d = 0; d < 6; d++) for (let i = 0; i < BLOQUES; i++) {
      celdas[d][i].classList.toggle('lleno', estado[d][i]);
      if (estado[d][i]) n++;
    }
    document.getElementById('total').textContent = n ? `${n / 2} h ocupadas por semana` : 'Sin horas cargadas';
  }

  // Tocar / arrastrar: el primer bloque decide si se pinta o se borra
  let modo = null;
  function celdaEn(x, y) {
    const el = document.elementFromPoint(x, y);
    return el && el.classList.contains('c') ? el : null;
  }
  function aplicar(el) {
    if (!el) return;
    const d = +el.dataset.d, i = +el.dataset.i;
    if (estado[d][i] !== modo) { estado[d][i] = modo; el.classList.toggle('lleno', modo); }
  }
  g.addEventListener('pointerdown', e => {
    const el = celdaEn(e.clientX, e.clientY);
    if (!el) return;
    modo = !estado[+el.dataset.d][+el.dataset.i];
    aplicar(el);
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  });
  g.addEventListener('pointermove', e => { if (modo !== null) aplicar(celdaEn(e.clientX, e.clientY)); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t =>
    g.addEventListener(t, () => { if (modo !== null) { modo = null; pintar(); } }));

  document.getElementById('borrar').onclick = () => {
    estado.forEach(dia => dia.fill(false));
    pintar();
  };

  function guardar() {
    const datos = JSON.stringify({ tipo: 'horarios', o: codificar() });
    if (tg && tg.initData !== undefined && tg.sendData) tg.sendData(datos);   // cierra la mini app
    else alert('Abrí esta página desde el botón 🗓️ Mis horarios del bot.\n\n' + datos);
  }

  decodificar(new URLSearchParams(location.search).get('o'));
  pintar();

  if (tg && tg.platform && tg.platform !== 'unknown') {
    tg.ready();
    tg.expand();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();   // que arrastrar no cierre la app
    tg.MainButton.setText('💾 Guardar mis horarios');
    tg.MainButton.onClick(guardar);
    tg.MainButton.show();
  } else {
    const b = document.getElementById('guardarWeb');
    b.style.display = 'block';
    b.onclick = guardar;
  }
</script>
</body>
</html>
