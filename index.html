<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mis horarios (prueba)</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="rutas.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --txt: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --sec: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btntxt: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--txt);
    font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: 10px 8px 90px; max-width: 520px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 2px 4px 4px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--hint); margin: 14px 4px 6px; text-transform: uppercase; letter-spacing: .3px; }
  p.ayuda { margin: 0 4px 8px; color: var(--hint); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 4px 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 16px; padding: 6px 10px;
    font-size: 13px; color: #fff; cursor: pointer; opacity: .55; }
  .chip.activa { opacity: 1; box-shadow: 0 0 0 2px var(--txt); }
  .chip .x { font-weight: 700; padding-left: 2px; }
  .chip.mas { background: var(--sec); color: var(--txt); opacity: 1; }
  .grilla { display: grid; grid-template-columns: 40px repeat(6, 1fr); gap: 2px;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  .cab { text-align: center; font-weight: 600; font-size: 12px; padding: 4px 0;
    position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .hora { font-size: 10px; color: var(--hint); text-align: right; padding-right: 4px; height: 17px; line-height: 17px; }
  .hora.media { visibility: hidden; }
  .c { height: 17px; background: var(--sec); border-radius: 3px; }
  .c.hora-entera { box-shadow: inset 0 1px 0 rgba(128,128,128,.25); }
  .barra { display: flex; gap: 8px; margin: 12px 4px 0; align-items: center; }
  .barra button { border: 0; border-radius: 8px; padding: 9px 12px; font-size: 14px; background: var(--sec); color: var(--txt); }
  .barra .total { margin-left: auto; color: var(--hint); font-size: 13px; }
  .casa { margin: 0 4px; display: flex; gap: 8px; align-items: center; background: var(--sec); border-radius: 10px; padding: 8px 10px; }
  .casa input { flex: 1; border: 0; background: transparent; color: var(--txt); font-size: 14px; outline: none; }
  #guardarWeb { display: none; width: 100%; margin-top: 12px; padding: 12px; border: 0;
    border-radius: 10px; background: var(--btn); color: var(--btntxt); font-size: 15px; font-weight: 600; }
  /* buscador de escuelas */
  #capa { position: fixed; inset: 0; background: var(--bg); z-index: 10; display: none; flex-direction: column; padding: 10px 8px; }
  #capa.abierta { display: flex; }
  #capa .top { display: flex; gap: 8px; margin-bottom: 8px; }
  #capa input { flex: 1; border: 0; border-radius: 10px; padding: 10px 12px; background: var(--sec); color: var(--txt); font-size: 15px; outline: none; }
  #capa .cerrar { border: 0; background: none; color: var(--btn); font-size: 15px; }
  #lista { overflow-y: auto; flex: 1; }
  .op { padding: 10px 6px; border-bottom: 1px solid var(--sec); cursor: pointer; }
  .op small { color: var(--hint); display: block; }
  .op.otra { color: var(--btn); }
  /* pestañas y "Mi semana" (23/11) */
  .tabs { display: flex; background: var(--sec); border-radius: 10px; padding: 3px; margin: 4px 4px 10px; }
  .tabs button { flex: 1; border: 0; background: none; color: var(--txt); padding: 7px; border-radius: 8px; font-size: 14px; }
  .tabs button.on { background: var(--btn); color: var(--btntxt); }
  .card { background: var(--sec); border-radius: 10px; padding: 8px 10px; margin: 0 4px 10px; }
  .card .t { color: var(--hint); font-size: 11px; letter-spacing: .4px; }
  .libre { color: #3fb96f; }
  code { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--btn); font-size: 13px; }
  .chica { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 0 4px 10px; text-align: center; }
  .chica > div { background: var(--sec); border-radius: 8px; padding: 4px 2px; }
  .chica .hoy, .col.hoy { box-shadow: 0 0 0 1.5px var(--btn); }
  .chica .bar { height: 30px; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 0 3px; }
  .chica .bar i { display: block; height: 7px; border-radius: 2px; }
  .chica small, .ejes small { color: var(--hint); font-size: 11px; }
  .sem { display: grid; grid-template-columns: 52px repeat(6, 1fr); gap: 3px; margin: 0 4px; }
  .sem .cabd { text-align: center; font-size: 12px; color: var(--hint); }
  .sem .cabd.hoy { color: var(--btn); font-weight: 600; }
  .ejes, .col { position: relative; }
  .ejes small { position: absolute; right: 3px; white-space: nowrap; transform: translateY(-50%); }
  .col { background: var(--sec); border-radius: 6px; overflow: hidden; }
  .col .ln { position: absolute; left: 0; right: 0; border-top: 1px solid rgba(128,128,128,.18); }
  .col .ln.p { border-top: 1px dashed rgba(128,128,128,.4); }
  .col .bl { position: absolute; left: 2px; right: 2px; border-radius: 4px; color: #fff; font-size: 10px; line-height: 1.15;
    text-align: center; overflow: hidden; padding-top: 1px; }
  .col .vl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    writing-mode: vertical-rl; color: #3fb96f; font-size: 12px; }
  .ley { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 4px 10px; font-size: 12px; }
  .ley i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  #irEditar { width: calc(100% - 8px); margin: 4px 4px 0; padding: 11px; border: 0; border-radius: 10px;
    background: var(--btn); color: var(--btntxt); font-size: 15px; }
  .oculto { display: none !important; }
  /* pestaña "🚌 Viaje" (23/11) */
  .st { display: flex; gap: 6px; margin-top: 6px; text-align: center; }
  .st div { flex: 1; background: var(--bg); border-radius: 8px; padding: 5px 2px; }
  .st b { display: block; font-size: 15px; }
  .st small { color: var(--hint); font-size: 11px; }
  .saldo { font-size: 18px; font-weight: 600; }
  .warn { color: #e6a23c; }
  .barra-sube { height: 7px; background: var(--bg); border-radius: 4px; overflow: hidden; margin: 5px 0; }
  .barra-sube div { height: 100%; border-radius: 4px; }
  .fila2 { display: flex; gap: 6px; margin-top: 7px; }
  .b2 { flex: 1; border: 1px solid var(--btn); background: none; color: var(--btn); border-radius: 8px; padding: 6px; font-size: 13px; }
  .anotar { display: flex; gap: 6px; margin-top: 7px; }
  .anotar input { flex: 1; min-width: 0; border: 0; border-radius: 8px; padding: 7px 9px; background: var(--bg); color: var(--txt); font-size: 15px; }
  .anotar button { border: 0; border-radius: 8px; padding: 7px 12px; background: var(--btn); color: var(--btntxt); }
  .itin { position: relative; padding-left: 22px; }
  .itin::before { content: ""; position: absolute; left: 8px; top: 12px; bottom: 12px; width: 2px; background: rgba(128,128,128,.35); }
  .itin .pto { position: relative; margin: 2px 0; }
  .itin .pto .ic2 { position: absolute; left: -22px; width: 18px; text-align: center; }
  .itin .leg { color: var(--hint); font-size: 12.5px; margin: 3px 0 5px; }
  .lnv { display: inline-block; background: var(--btn); color: var(--btntxt); border-radius: 5px; padding: 0 5px; font-weight: 700; font-size: 12px; margin-right: 2px; }
  .tramos { display: flex; background: var(--sec); border-radius: 10px; padding: 3px; margin: 0 4px 8px; }
  .tramos button { flex: 1; border: 0; background: none; color: var(--txt); padding: 7px 2px; border-radius: 8px; font-size: 13px; }
  .tramos button.on { background: var(--btn); color: var(--btntxt); }
  .opv { background: var(--sec); border-radius: 12px; padding: 10px 12px; margin: 0 4px 8px; }
  .opv .cabv { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; gap: 8px; }
  .opv .cabv b { font-size: 15px; }
  .precio { color: #2e9e6a; font-weight: 600; white-space: nowrap; }
  .paso { display: flex; gap: 8px; padding: 3px 0; align-items: flex-start; }
  .paso .ic { width: 20px; text-align: center; flex: 0 0 20px; }
  .ln { display: inline-block; background: var(--btn); color: var(--btntxt); border-radius: 6px; padding: 0 6px; font-weight: 700; font-size: 13px; margin-right: 2px; }
  .ln.alt { background: transparent; color: var(--btn); box-shadow: inset 0 0 0 1.5px var(--btn); }
  .h { color: var(--hint); font-size: 12.5px; }
  .sube { color: #2e9e6a; font-size: 12.5px; }
  .tl { display: block; position: relative; padding: 2px 0 2px 20px; margin: 4px 0 2px; }
  .tl::before { content: ""; position: absolute; left: 5px; top: 10px; bottom: 10px; width: 2px; background: var(--btn); }
  .tl .pt { position: relative; display: block; }
  .tl .pt::before { content: ""; position: absolute; left: -20px; top: 4px; width: 12px; height: 12px; border-radius: 50%; }
  .tl .s::before { background: #2e9e6a; } .tl .b::before { background: #d9534f; }
  .tl a { color: var(--txt); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .tl .medio { display: block; color: var(--hint); font-size: 12.5px; padding: 1px 0; }
  .vacio { text-align: center; padding: 18px 8px; }
  .vacio .gr { font-size: 30px; }
  .pie { color: var(--hint); font-size: 11.5px; text-align: center; margin: 8px 4px 0; }
  .lnt { display: inline-block; background: #1a9e8f; color: #fff; border-radius: 5px; padding: 0 5px; font-weight: 700; font-size: 12px; margin-right: 2px; }
  .ln.tren { background: #1a9e8f; }
  .tl.tren::before { background: #1a9e8f; width: 3px; }
  .bd { display: inline-block; border-radius: 6px; padding: 1px 7px; font-size: 11.5px; margin: 0 4px 3px 0; }
  .bd.b { background: rgba(63,185,111,.16); color: #3fb96f; }
  .bd.r { background: rgba(82,136,193,.18); color: var(--btn); }
  .comp { display: flex; gap: 6px; margin: 0 4px 6px; }
  .comp button { flex: 1; border: 0; background: var(--sec); color: var(--txt); border-radius: 10px; padding: 7px 4px; text-align: center; }
  .comp button.on { box-shadow: 0 0 0 1.5px #1a9e8f; }
  .comp b { display: block; font-size: 16px; }
  .ahorro { text-align: center; color: var(--hint); font-size: 12.5px; margin: 0 4px 8px; }
  .hr { color: var(--btn); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  .cuenta { text-align: center; }
  .cuenta .num { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .5px; margin: 2px 0; }
  .cuenta .num.ok { color: var(--txt); } .cuenta .num.warn { color: #e6a23c; } .cuenta .num.ya { color: #e05555; }
  .cuenta .barra-sube { margin-top: 7px; }
  .confirmar { display: block; width: calc(100% - 8px); margin: 0 4px 8px; border: 1px solid #1a9e8f; background: none; color: #1a9e8f; border-radius: 10px; padding: 8px; font-size: 13px; }
  .dir { color: var(--btn); text-decoration: underline; text-underline-offset: 2px; word-break: break-word; }
</style>
</head>
<body>
  <h1>🗓️ Mis horarios</h1>
  <div class="tabs"><button id="tabSemana" class="on">📊 Semana</button><button id="tabViaje">🚌 Viaje</button><button id="tabEditar">✏️ Editar</button></div>

  <div id="vistaSemana"></div>
  <div id="vistaViaje" class="oculto"></div>

  <div id="vistaEditar">
  <p class="ayuda">Elegí una escuela y pintá las horas en que trabajás ahí. Tocá o arrastrá el dedo.</p>

  <h2>1 · Escuela</h2>
  <div class="chips" id="chips"></div>

  <div class="grilla" id="grilla"></div>
  <div class="barra">
    <button id="borrar">🧹 Borrar todo</button>
    <span class="total" id="total"></span>
  </div>

  <h2>2 · Tu casa</h2>
  <div class="casa">🏠 <input id="casa" maxlength="120" placeholder="Calle y número, localidad"></div>
  <p class="ayuda" style="margin-top:6px">Se usa para calcular cuánto tardás desde tu casa. Queda guardada solo en la planilla del bot.</p>

  <button id="guardarWeb">Guardar</button>
  </div>

  <div id="capa">
    <div class="top"><input id="buscar" placeholder="Número o nombre (ej: secundaria 34)" autocomplete="off"><button class="cerrar" id="cerrarCapa">Cerrar</button></div>
    <div id="lista"></div>
  </div>

<script>
  // Grilla: 6 días (lun a sáb) × 32 bloques de 30 min (de 7:00 a 23:00) = 192 casillas.
  // Cada casilla guarda un dígito: 0 libre, 1..8 = escuela de la lista, 9 = ocupado sin escuela (datos viejos).
  const DIAS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
  const BLOQUES = 32, INICIO = 7 * 60, MAX_ESC = 8;
  const COLORES = ['#3a7bd5', '#c7792b', '#2e9e6a', '#9b59b6', '#d64545', '#1aa3a3', '#b8860b', '#e0559a'];
  const SIN_ESC = '#7d8790';
  const tg = window.Telegram && Telegram.WebApp;
  let escuelas = [];          // [{c: código ABC o '', n: nombre}]
  let g = new Array(192).fill(0);
  let activa = 1;             // escuela con la que se pinta (1..8)
  let catalogo = [];

  const idx = (d, i) => d * BLOQUES + i;
  function hhmm(min) { return `${Math.floor(min / 60)}:${String(min % 60).padStart(2, '0')}`; }

  // ── cargar lo que ya tenía (parámetro d = JSON en base64 url; o = formato viejo en hex)
  function desdeB64(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(s); const bytes = Uint8Array.from(bin, ch => ch.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }
  function cargar() {
    const q = new URLSearchParams(location.search);
    try {
      if (q.get('d')) {
        const x = JSON.parse(desdeB64(q.get('d')));
        escuelas = (x.e || []).slice(0, MAX_ESC);
        if (/^[0-9]{192}$/.test(x.g || '')) g = x.g.split('').map(Number);
        document.getElementById('casa').value = x.h || '';
        return;
      }
    } catch (err) { /* dato roto: arranca vacío */ }
    const hex = q.get('o');
    if (/^[0-9a-f]{48}$/i.test(hex || '')) {
      for (let d = 0; d < 6; d++) {
        const bits = parseInt(hex.substr(d * 8, 8), 16);
        for (let i = 0; i < BLOQUES; i++) if ((bits >>> (31 - i)) & 1) g[idx(d, i)] = 9;
      }
    }
  }

  // ── chips de escuelas
  function color(v) { return v === 9 ? SIN_ESC : COLORES[v - 1]; }
  function dibujarChips() {
    const cont = document.getElementById('chips');
    cont.innerHTML = '';
    escuelas.forEach((e, k) => {
      const b = document.createElement('button');
      b.className = 'chip' + (activa === k + 1 ? ' activa' : '');
      b.style.background = COLORES[k];
      b.innerHTML = `<span>${esc(e.n)}</span><span class="x" title="Quitar">×</span>`;
      b.onclick = ev => {
        if (ev.target.classList.contains('x')) return quitar(k);
        activa = k + 1; dibujarChips();
      };
      cont.appendChild(b);
    });
    if (g.includes(9)) {
      const b = document.createElement('button');
      b.className = 'chip' + (activa === 9 ? ' activa' : '');
      b.style.background = SIN_ESC;
      b.textContent = 'Sin escuela';
      b.onclick = () => { activa = 9; dibujarChips(); };
      cont.appendChild(b);
    }
    if (escuelas.length < MAX_ESC) {
      const m = document.createElement('button');
      m.className = 'chip mas';
      m.textContent = '＋ Agregar escuela';
      m.onclick = abrirBuscador;
      cont.appendChild(m);
    }
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }

  function quitar(k) {
    const nombre = escuelas[k].n;
    if (!confirm(`¿Quitar ${nombre}? Se borran también sus horas pintadas.`)) return;
    escuelas.splice(k, 1);
    g = g.map(v => v === k + 1 ? 0 : (v > k + 1 && v !== 9 ? v - 1 : v));
    if (activa > escuelas.length && activa !== 9) activa = Math.max(1, escuelas.length);
    dibujarChips(); pintar();
  }

  // ── buscador
  function norm(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function abrirBuscador() {
    document.getElementById('capa').classList.add('abierta');
    const i = document.getElementById('buscar'); i.value = ''; filtrar(); i.focus();
  }
  function cerrarBuscador() { document.getElementById('capa').classList.remove('abierta'); }
  function agregar(c, n) {
    if (escuelas.some(e => e.c && e.c === c)) { cerrarBuscador(); return; }
    escuelas.push({ c, n: n.slice(0, 60) });
    activa = escuelas.length;
    cerrarBuscador(); dibujarChips();
  }
  function filtrar() {
    const t = norm(document.getElementById('buscar').value.trim());
    const lista = document.getElementById('lista');
    lista.innerHTML = '';
    const palabras = t.split(/\s+/).filter(Boolean);
    const res = !palabras.length ? [] : catalogo.filter(([c, n, loc]) => {
      const texto = norm(n + ' ' + loc + ' ' + n.replace('N° ', ''));
      return palabras.every(p => /^\d+$/.test(p) ? new RegExp('n° ' + p + '\\b').test(norm(n)) : texto.includes(p));
    }).slice(0, 40);
    res.forEach(([c, n, loc]) => {
      const d = document.createElement('div');
      d.className = 'op';
      d.innerHTML = `${esc(n)}<small>${esc(loc || 'La Matanza')}</small>`;
      d.onclick = () => agregar(c, loc ? `${n} · ${loc}` : n);
      lista.appendChild(d);
    });
    const otra = document.createElement('div');
    otra.className = 'op otra';
    otra.textContent = palabras.length ? `＋ Usar "${document.getElementById('buscar').value.trim()}" (otra escuela u otro distrito)`
                                       : 'Escribí el número o el nombre. Si es de otro distrito, escribí el nombre y la dirección.';
    if (palabras.length) otra.onclick = () => agregar('', document.getElementById('buscar').value.trim());
    lista.appendChild(otra);
  }
  document.getElementById('buscar').addEventListener('input', filtrar);
  document.getElementById('cerrarCapa').onclick = cerrarBuscador;

  // ── grilla
  const grilla = document.getElementById('grilla');
  grilla.appendChild(Object.assign(document.createElement('div'), { className: 'cab' }));
  DIAS.forEach(d => grilla.appendChild(Object.assign(document.createElement('div'), { className: 'cab', textContent: d })));
  const celdas = [];
  for (let i = 0; i < BLOQUES; i++) {
    const min = INICIO + i * 30;
    grilla.appendChild(Object.assign(document.createElement('div'), { className: 'hora' + (min % 60 ? ' media' : ''), textContent: hhmm(min) }));
    for (let d = 0; d < 6; d++) {
      const c = document.createElement('div');
      c.className = 'c' + (min % 60 ? '' : ' hora-entera');
      c.dataset.k = idx(d, i);
      grilla.appendChild(c);
      celdas[idx(d, i)] = c;
    }
  }
  function pintarCelda(k) { celdas[k].style.background = g[k] ? color(g[k]) : ''; }
  function pintar() {
    let n = 0;
    for (let k = 0; k < 192; k++) { pintarCelda(k); if (g[k]) n++; }
    document.getElementById('total').textContent = n ? `${n / 2} h ocupadas por semana` : 'Sin horas cargadas';
  }

  let modo = null;   // valor que se pone al arrastrar (escuela activa o 0 para borrar)
  function celdaEn(x, y) { const el = document.elementFromPoint(x, y); return el && el.classList.contains('c') ? el : null; }
  function aplicar(el) { if (!el) return; const k = +el.dataset.k; if (g[k] !== modo) { g[k] = modo; pintarCelda(k); } }
  grilla.addEventListener('pointerdown', e => {
    const el = celdaEn(e.clientX, e.clientY);
    if (!el) return;
    if (!escuelas.length && activa !== 9) { abrirBuscador(); return; }
    modo = g[+el.dataset.k] === activa ? 0 : activa;
    aplicar(el);
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  });
  grilla.addEventListener('pointermove', e => { if (modo !== null) aplicar(celdaEn(e.clientX, e.clientY)); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t =>
    grilla.addEventListener(t, () => { if (modo !== null) { modo = null; pintar(); dibujarChips(); } }));

  document.getElementById('borrar').onclick = () => {
    if (!confirm('¿Borrar todas las horas pintadas? Las escuelas quedan en la lista.')) return;
    g.fill(0); pintar(); dibujarChips();
  };


  // ── "📊 Mi semana": pantallazo rápido de la semana (solo mirar; para cambiar, ✏️ Editar)
  const DIAS_L = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  const hm = min => `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;
  const coma = n => String(n).replace('.', ',');
  function nomEsc(v) { return v === 9 ? 'Sin escuela' : String((escuelas[v - 1] || {}).n || '').split(' · ')[0]; }

  function tramos() {
    const t = [];

  function dibujarSemana() {
    const t = tramos();
    const hoyD = new Date().getDay() - 1;          // 0 = lunes … 5 = sábado, -1 = domingo
    const ahora = new Date().getHours() * 60 + new Date().getMinutes();
    let h = '';

    for (let d = 0; d < 6; d++) {
      const del = t.filter(x => x.d === d);
      h += `<div class="col${d === hoyD ? ' hoy' : ''}" style="height:${alto}px">` +
        marcas.slice(1, -1).map(m => `<div class="ln${m === 14 * 60 || m === 18 * 60 ? ' p' : ''}" style="top:${y(m)}px"></div>`).join('') +
        del.map(x => `<div class="bl" style="top:${y(x.a)}px;height:${Math.max(24, (x.b - x.a) * PX)}px;background:${color(x.v)}">${hm(x.a)}<br><b>${esc(numEsc(x.v))}</b></div>`).join('') +
        (del.length ? '' : '<div class="vl">libre</div>') + '</div>';
    }

    // Leyenda

      `<div>🟢 ${DIAS[x.d]} <code>${hm(x.a)}–${hm(x.b)}</code> · ${coma((x.b - x.a) / 60)} h</div>`).join('') + '</div>';

  // ── "🚌 Viaje": el viaje de HOY (casa → escuela(s) → casa) y tu saldo SUBE anotado
  const API = "https://script.google.com/macros/s/AKfycbzTxYR89iMocFEuqSTIf5_LWwqT9Q11w13woV52pHIgLdCDXJZLvyWkPFdIUPs2Rx1DXA/exec";

  let VJ = { estado: 'nada', casa: null, esc: {} }, TRAMO = 0, SUBE = null, ANOTANDO = false;

  function cargarViaje() {

      .then(([, p]) => {

      .then(() => { if (!document.getElementById('vistaViaje').classList.contains('oculto')) dibujarViaje(); });
  }

  // saldo anotado: en la nube de Telegram de cada uno (no va a la planilla)
  function subeFirma() { const q = new URLSearchParams(location.search); return (tg && tg.initData ? 'init=' + encodeURIComponent(tg.initData) : '') + '&u=' + encodeURIComponent(q.get('u') || ''); }
  function leerSube(listo) {

      .then(j => { SUBE = (j && !j.error && !j.vacio) ? j : null; }).catch(() => { SUBE = null; }).then(listo);
  }
  function guardarSube(monto) {
    SUBE = { base: monto, estim: monto, dias: 0, fecha: '' };
    fetch(API + '?accion=sube&set=' + monto + '&' + subeFirma()).then(r => r.json())
      .then(j => { if (j && !j.error) { SUBE = j; dibujarViaje(); } }).catch(() => {});

  function cuando(t) {

  }

  function posDe(v) { const s = escuelas[v - 1]; const p = s && s.c && VJ.esc[s.c]; return p ? [p.la, p.lo] : null; }
  function tramoViaje(A, B) {             // mejor forma de ir de A a B: { min, costo, pie, ops } o null
    if (!A || !B) return null;

  // ── Google (transporte público): tramos del día con horarios; OSM queda de respaldo
  const TREN_TARIFAS = [[12, 530], [24, 689], [999, 848]];   // SUBE registrada, por sección (aprox., sep/2026)

  const aMin = t => { const m = String(t || '').match(/^(\d+):(\d+)/); return m ? +m[1] * 60 + +m[2] : null; };

  function costoG(o) {

  function legGoogle(g) {

  }
  function chipsPasos(o) {

  function linkPunto(pt) {

  // Dirección de la escuela de destino de un tramo (para mostrarla y linkearla a Google Maps)

  function htmlOpcionG(o, destino, insignias, destEsc) {

        `<span class="h">${p.hacia ? 'hacia ' + esc(p.hacia) : ''}</span>${n ? ` <span class="sube">−${n === 1 ? 50 : 75}% Red SUBE</span>` : ''}` +

  function planDelDia(d) {

  function lineasLeg(l) {

    return h + `<div class="paso"><span class="ic">🚶</span><span>${Math.round(o.pies[1])} m hasta ${destino}</span></div>` + (destEsc ? lineaDireccion(destEsc) : '') + '</div>';
  }
  function fechaCorta(f) { const m = String(f || '').match(/^(\d+)-(\d+)-(\d+)/); return m ? m[3] + '/' + m[2] : ''; }
  function htmlSube(gasto, para) {
    const estim = SUBE ? SUBE.estim : 0;
    let h = `<div class="card"><div class="t">💳 TU SUBE${SUBE ? ' · estimado' : ''}</div>`;
    if (SUBE) {
      const resto = estim - gasto, ok = resto >= 0;
      h += `<span class="saldo${ok ? '' : ' warn'}">≈ ${plata(estim)}</span> ` + (gasto ? (ok ? `<span class="libre">· alcanza ${para} ✅</span>` : `<span class="warn">· cargá ⚠️</span>`) : '');
      if (gasto) h += `<div class="barra-sube"><div style="width:${Math.min(100, Math.round(gasto / Math.max(estim, 1) * 100))}%;background:${ok ? '#3fb96f' : '#e6a23c'}"></div></div>` +
        `<span class="h">${ok ? `Gastás ≈ ${plata(gasto)} · te quedan ≈ ${plata(resto)}` : 'Cargá antes de viajar (el saldo negativo ayuda, pero es poco)'}</span>`;
      h += `<div class="h" style="margin-top:4px">Anotaste ${plata(SUBE.base)}${SUBE.fecha ? ' el ' + fechaCorta(SUBE.fecha) : ''}${SUBE.dias ? ' · resté ' + SUBE.dias + ' viaje' + (SUBE.dias > 1 ? 's' : '') : ''}</div>`;
    } else h += `<span class="h">Anotá tu saldo y te digo si te alcanza${gasto ? ' (necesitás ≈ ' + plata(gasto) + ')' : ''}. También podés escribir <b>/saldo 5800</b> en el chat.</span>`;
    h += ANOTANDO
      ? '<div class="anotar"><input id="montoSube" type="number" inputmode="decimal" placeholder="Ej: 5800"><button id="okSube">Guardar</button></div>'
      : '<div class="fila2"><button class="b2" id="anotarSube">✏️ Anotar saldo</button><button class="b2" id="verSube">🔎 Ver en Mi SUBE</button></div>';
    return h + '</div>';
  }
  const EMOJI_ESC = ['🟦', '🟧', '🟩', '🟪', '🟥', '🟫', '🟨', '🩷'];
  function nombreParada(p) { return p.casa ? '🏠' : (p.v === 9 ? '⬜' : EMOJI_ESC[p.v - 1]); }

  // ── Contador en vivo: cuánto falta para salir (si se pasa, salta a la próxima opción o al próximo tramo)
  let RELOJ = null;
  function fechaHoy(min) { const f = new Date(); f.setHours(Math.floor(min / 60), min % 60, 0, 0); return f; }
  function proximaSalida(plan) {
    const ahora = new Date();
    for (let k = 0; k < plan.legs.length; k++) {
      const l = plan.legs[k], v = l.v;
      if (!v) continue;
      const nombre = k === 0 ? 'a ' + cortaEsc(l.a.v) : l.a.casa ? 'de vuelta a casa' : 'a ' + cortaEsc(l.a.v);
      if (v.fuente === 'google') {
        const cand = [v.elegida].concat(v.ops.filter(o => o !== v.elegida).sort((a, b) => aMin(a.sale) - aMin(b.sale)));
        const o = cand.find(o => fechaHoy(aMin(o.sale)).getTime() + 2 * 60000 > ahora);   // 2 min de gracia
        if (o) return { cuando: fechaHoy(aMin(o.sale)), sale: o.sale, llega: o.llega, como: chipsPasos(o), nombre, proximo: o !== v.elegida };
      } else {
        const sale = k === 0 ? plan.sali : (l.de.b || 0);
        if (sale != null && fechaHoy(sale).getTime() + 2 * 60000 > ahora)
          return { cuando: fechaHoy(sale), sale: hm(sale), llega: hm(sale + v.min), como: lineasLeg(l).split(' ≈')[0], nombre, proximo: false };
      }
    }
    return null;
  }
  function htmlCuenta(plan) {
    const p = proximaSalida(plan);
    if (!p) return '<div class="card cuenta"><div class="t">HOY</div><b class="libre">Terminaste los viajes de hoy ✅</b></div>';
    return `<div class="card cuenta" data-cuando="${p.cuando.getTime()}"><div class="t">${p.proximo ? 'SE PASÓ LA MEJOR · PRÓXIMA OPCIÓN EN' : 'TENÉS QUE SALIR EN'}</div>` +
      `<div class="num ok" id="cuentaNum">–</div>` +
      `<div class="h">a las ${esc(p.sale)} · ${esc(p.nombre)} · ${p.como} · llegás ${esc(p.llega)}</div>` +
      '<div class="barra-sube"><div id="cuentaBarra" style="width:100%;background:#3fb96f"></div></div></div>';
  }
  function arrancarReloj() {
    if (RELOJ) clearInterval(RELOJ);
    const c = document.querySelector('.cuenta[data-cuando]');
    if (!c) return;
    const meta = +c.dataset.cuando;
    const tic = () => {
      const n = document.getElementById('cuentaNum'), b = document.getElementById('cuentaBarra');
      if (!n) { clearInterval(RELOJ); return; }
      const falta = Math.round((meta - Date.now()) / 1000);
      if (falta < -120) { dibujarViaje(); return; }                    // se pasó: pasa a la próxima
      if (falta <= 0) { n.textContent = '¡Salí ya!'; n.className = 'num ya'; b.style.width = '0%'; return; }
      const hh = Math.floor(falta / 3600), mm = Math.floor(falta % 3600 / 60), ss = falta % 60;
      n.textContent = `${hh}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
      n.className = 'num ' + (falta <= 15 * 60 ? 'warn' : 'ok');
      b.style.width = Math.min(100, falta / 3600 * 100) + '%';
      b.style.background = falta <= 15 * 60 ? '#e6a23c' : '#3fb96f';
    };
    tic(); RELOJ = setInterval(tic, 1000);
  }

  function dibujarViaje() {
    const vv = document.getElementById('vistaViaje');
    if (VJ.estado === 'nada' || VJ.estado === 'cargando') { cargarViaje(); vv.innerHTML = '<div class="card vacio">🚌 Cargando recorridos…</div>'; return; }
    if (VJ.estado === 'error') {
      const txt = VJ.error === 'recorridos' ? 'No pude cargar los recorridos. Probá en un rato.'
        : VJ.error === 'sin firma' || VJ.error === 'no autorizado' ? 'Tu botón 🗓️ Mis horarios es viejo. Andá a ✏️ Editar y tocá Guardar una vez: el bot te manda el botón nuevo.'
        : VJ.error === 'sin cliente' ? 'No te encuentro en la planilla del bot.'
        : VJ.error === 'clave incorrecta' ? 'Falta publicar la versión nueva del Apps Script (Implementar → Nueva versión).'
        : 'No pude pedir tus datos al bot.';
      vv.innerHTML = `<div class="card vacio">😕 ${txt}<br><span class="h">(${esc(VJ.error)})</span></div>`;
      return;
    }
    const hoyD = new Date().getDay() - 1;
    let h = '';
    if (!VJ.casa) h += '<div class="card">🏠 <b>Falta tu casa.</b><br><span class="h">Escribila en ✏️ Editar y guardá: con eso calculo tus viajes.</span></div>';
    if (hoyD >= 0 && hoyD < 6) pedirRutas(hoyD);
    const plan = hoyD >= 0 ? planDelDia(hoyD) : null;
    if (!plan) {
      let prox = null, pd = -1;
      for (let k = 1; k <= 7 && !prox; k++) { const d = (hoyD + k + 7) % 7; if (d < 6) { prox = planDelDia(d); pd = d; } }
      if (prox && !RUTAS[pd]) { pedirRutas(pd); prox = planDelDia(pd); }
      h += '<div class="card vacio"><div class="gr">🛋️</div><b>Hoy no tenés que viajar</b><br>' + (prox
        ? `<span class="h">Próximo viaje: ${DIAS_L[pd + 1]}${prox.sali !== null ? ' ' + hm(prox.sali) : ''} a ${esc(cortaEsc(prox.paradas[0].v))}</span>` : '') + '</div>';
      h += htmlSube(prox ? prox.costo : 0, prox ? 'para el ' + DIAS_L[pd + 1].toLowerCase() : '');
    } else {
      const varias = plan.paradas.length > 1;
      h += `<div class="card"><div class="t">HOY · ${DIAS_L[hoyD + 1].toUpperCase()} · ` + (varias ? `${plan.legs.length} viajes` :
        `<span style="color:${color(plan.paradas[0].v)}">■</span> ${esc(nomEsc(plan.paradas[0].v))} a las ${hm(plan.paradas[0].a)}`) + '</div>' +
        htmlCuenta(plan).replace('<div class="card cuenta"', '<div class="cuenta" style="margin-top:6px"') +
        `<div class="st"><div><small>Viaje</small><b>${plan.min ? durTxt(plan.min) : '–'}</b></div>` +
        `<div><small>${varias ? 'Todo el día' : 'Ida y vuelta'}</small><b>${plata(plan.costo)}</b></div></div>` +
        (plan.faltan ? `<span class="h warn">Sin dato para ${plan.faltan} tramo${plan.faltan > 1 ? 's' : ''}: el total puede ser mayor.</span>` : '') + '</div>';
      h += htmlSube(plan.costo, varias ? 'para todo el día' : 'ida y vuelta');
      // itinerario
      h += '<div class="card itin">';
      plan.legs.forEach((l, k) => {
        const p = l.de;
        if (k === 0) h += `<div class="pto"><span class="ic2">🏠</span><b>Casa</b>${plan.sali !== null ? ` · salí <code>${hm(plan.sali)}</code>` : ''}</div>`;
        else h += `<div class="pto"><span class="ic2">${nombreParada(p)}</span><b>${esc(cortaEsc(p.v))}</b> <code>${hm(p.a)}–${hm(p.b)}</code></div>`;
        if (k > 0 && !l.a.casa && l.v) {
          const llego = l.v.fuente === 'google' ? aMin(l.v.elegida.llega) : p.b + l.v.min, sale = l.v.fuente === 'google' ? aMin(l.v.elegida.sale) : p.b;
          const libre = l.a.a - llego;
          if (libre >= 20) h += `<div class="leg">⏳ ${sale - p.b >= 20 ? 'salís ' + hm(sale) + ' · ' : ''}hueco de ${durTxt(libre)} · llegás ${hm(llego)}</div>`;
        }
        h += `<div class="leg">${lineasLeg(l)}</div>`;
      });
      h += `<div class="pto"><span class="ic2">🏠</span><b>Casa</b>${plan.llega !== null ? ` · ≈ ${hm(plan.llega)}` : ''}</div></div>`;
      // pestañas de tramos
      if (TRAMO >= plan.legs.length) TRAMO = 0;
      h += '<div class="tramos">' + plan.legs.map((l, k) => {
        const txt = k === 0 ? `🏠 → ${nombreParada(l.a)} Ida` : l.a.casa ? `${nombreParada(l.de)} → 🏠 Vuelta` : `${nombreParada(l.de)} → ${nombreParada(l.a)}`;
        return `<button data-tramo="${k}" class="${k === TRAMO ? 'on' : ''}">${txt}</button>`;
      }).join('') + '</div>';
      const l = plan.legs[TRAMO], destino = l.a.casa ? 'tu casa' : 'la escuela';
      const destEsc = escDestino(l);
      if (!l.v) h += `<div class="card vacio"><span class="h">${!l.de.pos || !l.a.pos ? 'No tengo la ubicación de ' + (!l.de.pos ? (l.de.casa ? 'tu casa' : 'la escuela') : (l.a.casa ? 'tu casa' : 'la escuela')) + '.' : 'No encontré colectivos que pasen cerca de los dos lugares.'}</span></div>`;
      else if (l.v.pie !== null) h += `<div class="opv"><div class="cabv"><b>🚶 A pie · ≈ ${l.v.min} min</b><span class="precio">$0</span></div><span class="h">Queda a ${Math.round(l.v.pie * 1.3)} m caminando, aprox.</span></div>`;
      else if (l.v.fuente === 'google') h += htmlTramoGoogle(l.v, TRAMO, destino, destEsc);
      else h += l.v.ops.slice(0, 2).map(o => htmlOpcionV(o, destino, destEsc)).join('');
      const rh = RUTAS[hoyD];
      if (rh === 'cargando') h += '<p class="pie">🔄 Buscando horarios de Google Maps…</p>';
      h += plan.google ? '<p class="pie">Horarios de Google Maps (pueden variar unos minutos). Precios aproximados con SUBE registrada.</p>'
        : `<p class="pie">Tiempos y precios aproximados (tarifa SUBE registrada). Recorridos de OpenStreetMap, ${esc(FECHA)}.</p>`;
    }
    vv.innerHTML = h;
    arrancarReloj();
    vv.querySelectorAll('[data-tramo]').forEach(b => b.onclick = () => { TRAMO = +b.dataset.tramo; dibujarViaje(); });
    vv.querySelectorAll('[data-op]').forEach(b => b.onclick = () => { ELEGIDA[TRAMO] = +b.dataset.op; dibujarViaje(); });
    vv.querySelectorAll('[data-trenes]').forEach(b => b.onclick = () => { if (tg && tg.openLink) tg.openLink(URL_TRENES); else window.open(URL_TRENES, '_blank'); });
    vv.querySelectorAll('a[data-url]').forEach(a => a.onclick = () => { if (tg && tg.openLink) tg.openLink(a.dataset.url); else window.open(a.dataset.url, '_blank'); });
    const an = document.getElementById('anotarSube'); if (an) an.onclick = () => { ANOTANDO = true; dibujarViaje(); const i = document.getElementById('montoSube'); if (i) i.focus(); };
    const vs = document.getElementById('verSube'); if (vs) vs.onclick = () => { if (tg && tg.openLink) tg.openLink(URL_MI_SUBE); else window.open(URL_MI_SUBE, '_blank'); };
    const ok = document.getElementById('okSube');
    if (ok) ok.onclick = () => {
      const m = parseFloat(String(document.getElementById('montoSube').value).replace(/\./g, '').replace(',', '.'));
      ANOTANDO = false;
      if (!isNaN(m) && m >= 0 && m < 200000) guardarSube(Math.round(m)); else dibujarViaje();
    };
  }

  function verTab(cual) {
    ['semana', 'viaje', 'editar'].forEach(t => {
      const N = t.charAt(0).toUpperCase() + t.slice(1);
      document.getElementById('tab' + N).classList.toggle('on', t === cual);
      document.getElementById('vista' + N).classList.toggle('oculto', t !== cual);
    });
    if (cual === 'semana') dibujarSemana();
    if (cual === 'viaje') leerSube(dibujarViaje); else if (RELOJ) { clearInterval(RELOJ); RELOJ = null; }
    if (tg && tg.MainButton && tg.platform && tg.platform !== 'unknown') { if (cual === 'editar') tg.MainButton.show(); else tg.MainButton.hide(); }
    window.scrollTo(0, 0);
  }
  document.getElementById('tabSemana').onclick = () => verTab('semana');
  document.getElementById('tabViaje').onclick = () => verTab('viaje');
  document.getElementById('tabEditar').onclick = () => verTab('editar');

  function guardar() {
    const datos = JSON.stringify({ tipo: 'horarios2', e: escuelas, g: g.join(''),
      h: document.getElementById('casa').value.trim().slice(0, 120) });
    if (tg && tg.initData !== undefined && tg.sendData) tg.sendData(datos);   // cierra la mini app
    else alert('Abrí esta página desde el botón 🗓️ Mis horarios del bot.\n\n' + datos);
  }

  cargar();
  if (!escuelas.length && !g.includes(9)) activa = 1; else if (!escuelas.length) activa = 9;
  dibujarChips(); pintar();
  fetch('escuelas.json').then(r => r.json()).then(x => { catalogo = x; }).catch(() => {});

  if (tg && tg.platform && tg.platform !== 'unknown') {
    tg.ready();
    tg.expand();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    tg.MainButton.setText('💾 Guardar mis horarios');
    tg.MainButton.onClick(guardar);
    tg.MainButton.show();
  } else {
    const b = document.getElementById('guardarWeb');
    b.style.display = 'block';
    b.onclick = guardar;
  }
  // Si ya tiene horarios arranca en "Mi semana"; si está vacío, directo a cargar
  verTab(g.some(v => v) ? 'semana' : 'editar');
</script>
</body>
